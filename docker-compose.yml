version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-news-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # ACME HTTP-01 验证文件（certbot/acme.sh 写入宿主机，nginx 对外提供）
      - ./certbot/wwwroot:/var/www/certbot
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 下访问宿主机
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
