/var/log/nginx/access.log /var/log/nginx/error.log {
    daily
    maxsize 20M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    create 0640 nginx nginx
    sharedscripts
    postrotate
        if [ -s /var/run/nginx.pid ]; then
            nginx -s reopen
        fi
    endscript
}
