# ============================================
# HTTP：仅保留 ACME 验证路径，其余 301 跳转 HTTPS
# ============================================
server {
    listen 80;
    server_name _;

    # ACME HTTP-01 验证：证书续期时 Let's Encrypt 仍走 80 端口
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS：站点主体
# 证书由 docker-compose 从宿主机 ./certs 挂载进来，
# 由 acme.sh --install-cert 维护并在续期后自动 reload
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HTTPS 运行稳定一段时间后可取消注释启用 HSTS
    # （启用后浏览器将强制记住仅 HTTPS 访问，回退需清浏览器数据）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 静态文件根目录
    root /usr/share/nginx/html;
    index index.html;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Vue Router History 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理 - 指向宿主机上运行的后端服务
    location /api/ {
        # 使用 host.docker.internal 访问宿主机
        proxy_pass http://host.docker.internal:3000/api/;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # Cookie 路径修正
        proxy_cookie_path / /;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 静态资源缓存策略
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 错误页面
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
