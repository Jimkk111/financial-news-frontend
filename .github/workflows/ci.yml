name: CI

on:
  # push 不限制分支，所有分支推送均触发；PR 仅在目标为 master 时触发
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 构建 & 测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run type-check

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build-only

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
