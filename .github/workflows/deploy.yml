name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

# 同一分支的部署串行排队，不中断进行中的部署
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH 部署
    # 仅部署本仓库 master 的 push / 手动 CI，PR 校验不能触发生产部署
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      # secrets 不能用于 if: 表达式，改为注入 env 后在脚本里判空
      - name: 检查部署密钥
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::error::缺少部署密钥。请在仓库 Settings → Secrets and variables → Actions 中配置 SSH_HOST、SSH_USER、SSH_PRIVATE_KEY、DEPLOY_PATH（可选 SSH_PORT）"
            exit 1
          fi

      - name: 通过 SSH 部署
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_SHA
          script: |
            set -e
            # workflow_run 的 github.sha 是默认分支提交；使用成功 CI 的 head_sha
            if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "部署失败：CI 提交 SHA 无效"
              exit 1
            fi
            # secret 粘贴时可能带上换行/首尾空格，或写成 ~ 开头，统一规整后再使用
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_DIR="$(printf '%s' "$DEPLOY_DIR" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            DEPLOY_DIR="${DEPLOY_DIR/#\~/$HOME}"
            cd "$DEPLOY_DIR" || { echo "部署失败：服务器上不存在目录 $DEPLOY_DIR，请检查 DEPLOY_PATH 是否为仓库实际路径"; exit 1; }
            echo "[1/3] 拉取 CI 已验证的代码（master，$DEPLOY_SHA）..."
            git fetch origin refs/heads/master:refs/remotes/origin/master
            # 旧 CI 可能更晚完成；分支已更新时跳过，避免回滚或部署未通过 CI 的代码
            if [ "$(git rev-parse origin/master)" != "$DEPLOY_SHA" ]; then
              echo "跳过部署：master 已有更新提交，等待对应 CI 成功"
              exit 0
            fi
            git checkout master
            git reset --hard "$DEPLOY_SHA"
            echo "[2/3] 重建并启动容器..."
            docker compose up -d --build
            echo "[3/3] 清理悬空镜像..."
            docker image prune -f
            echo "部署完成：$(hostname -I | awk '{print $1}')"
