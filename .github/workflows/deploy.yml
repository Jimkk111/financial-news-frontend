name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 同一分支的部署串行排队，不中断进行中的部署
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 部署前校验
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run type-check

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build-only

  deploy:
    name: SSH 部署
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      # secrets 不能用于 if: 表达式，改为注入 env 后在脚本里判空
      - name: 检查部署密钥
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::error::缺少部署密钥。请在仓库 Settings → Secrets and variables → Actions 中配置 SSH_HOST、SSH_USER、SSH_PRIVATE_KEY、DEPLOY_PATH（可选 SSH_PORT）"
            exit 1
          fi

      - name: 通过 SSH 部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            # secret 粘贴时可能带上换行/首尾空格，或写成 ~ 开头，统一规整后再使用
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_DIR="$(printf '%s' "$DEPLOY_DIR" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            DEPLOY_DIR="${DEPLOY_DIR/#\~/$HOME}"
            cd "$DEPLOY_DIR" || { echo "部署失败：服务器上不存在目录 $DEPLOY_DIR，请检查 DEPLOY_PATH 是否为仓库实际路径"; exit 1; }
            echo "[1/3] 拉取最新代码（${{ github.ref_name }}）..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            echo "[2/3] 重建并启动容器..."
            docker compose up -d --build
            echo "[3/3] 清理悬空镜像..."
            docker image prune -f
            echo "部署完成：$(hostname -I | awk '{print $1}')"
